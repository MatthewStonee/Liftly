<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Liftly Liquid Glass visual preview</title>
  <defs>
    <radialGradient id="bg" cx="49%" cy="34%" r="82%">
