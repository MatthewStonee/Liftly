      <stop offset="1" stop-color="#DDEEFF" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="glassRear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.86"/>
      <stop offset="0.16" stop-color="#DCEEFF" stop-opacity="0.48"/>
      <stop offset="0.58" stop-color="#6FA6E7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#DDEEFF" stop-opacity="0.64"/>
    </linearGradient>
    <linearGradient id="glassMiddle" x1="0" y1="0" x2="1" y2="1">
